[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "telegram-tools"
version = "3.8.0"
description = "Local CLI for your own Telegram chats and forum topics: chat/topic ID discovery, message search/export, topic message clearing, and bot settings editing — signed in as you, built on Telethon."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["telegram", "telethon", "cli", "forum-topics", "export"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Utilities",
]
dependencies = [
  "Telethon>=1.44,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
telegram-tools = "telegram_tools.cli:main"

[project.urls]
Homepage = "https://cli-tools-site.vercel.app/"
Repository = "https://github.com/banozz0/telegram-tools"
Issues = "https://github.com/banozz0/telegram-tools/issues"
Changelog = "https://github.com/banozz0/telegram-tools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_tools"]

[tool.hatch.build.targets.sdist]
# Build-process artifacts, not part of the distributed software. They stay public
# in the GitHub repo; they just have no business inside a package download.
exclude = [".superpowers", "docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
